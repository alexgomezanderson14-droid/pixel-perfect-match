name: Actualizar noticias festivas
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/**"
      - ".github/workflows/actualizar-noticias.yml"
  schedule:
    # Revisar después de las temporadas con concursos de peñas:
    # Mig Any (abril/mayo), l’Albir (agosto) y Santísimo Cristo/Jubileo (noviembre).
    - cron: "17 8 1 5,6,9,12 *"
permissions:
  contents: write
concurrency:
  group: actualizar-noticias-festivas
  cancel-in-progress: false
jobs:
  recopilar:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4
        with:
          ref: main
      - name: Recopilar noticias públicas
        run: node scripts/actualizar-noticias.mjs
      - name: Detectar premios oficiales de peñas
        run: node scripts/actualizar-premios.mjs
      - name: Publicar cambios
        run: |
          if git diff --quiet -- public/noticias-automaticas.json public/premios-automaticos.json; then
            echo "No hay noticias ni premios nuevos."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/noticias-automaticas.json public/premios-automaticos.json
          git commit -m "Actualizar noticias y premios de peñas automáticamente"
          git push
